services:
  db:
    # PostgreSQL 메이저 버전을 고정해 팀에서 같은 DB 계열로 개발한다.
    image: postgres:17
    # 컨테이너가 빈 데이터 볼륨을 처음 초기화할 때 쓰는 로컬 개발용 설정이다.
    environment:
      POSTGRES_USER: duri_pick
      POSTGRES_PASSWORD: duri_pick_dev
      POSTGRES_DB: duri_pick
    ports:
      # 호스트의 Express에서 접속하되 로컬 컴퓨터에만 포트를 연다.
      - "127.0.0.1:5432:5432"
    volumes:
      # 데이터 파일을 이름 있는 볼륨에 두면 컨테이너를 다시 만들어도 재사용할 수 있다.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # 프로세스 시작 후 DB가 연결을 받을 준비가 될 때까지 Compose가 기다릴 수 있게 한다.
      test: ["CMD-SHELL", "pg_isready -U duri_pick -d duri_pick"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
